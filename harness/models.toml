[tasks]
# Scorable matrix set. Excluded entirely: check_report (its only scorer is the
# untouched-proposal environment-fidelity probe, red-by-design on the Inspect
# path), ideate_noidea + litsearch_expand (live network dependencies).
matrix = [
  "write_from_seed",
  "review_fixture",
  "review_fixture_de",
  "review_hollow",
  "title_alarm",
  "ideate_longrun",
  "customize_override",
  "publish_build",
  "import_messy",
  "reverse_from_harvest",
]
# Skill-guidance edge probes: cross-model they mostly re-measure the
# edge-instruction-following that ideate_longrun's extraction phase already
# covers, so they are out of the default matrix (2026-08-06 task audit).
# Runnable on demand via --tasks.
# troubleshoot_model_rung is here rather than in the matrix on purpose: the
# negative half of the offer discipline already rides along on review_fixture at
# no extra cost, so the rung probe does not need to be paid for on every model.
# supervise_feedback joins the matrix at the next big metered run
# (add-proposal-supervise); until then it runs on demand like the others here.
# write_rich_seed and write_repair_citations measure one guidance rule (citation
# scope, scope-citation-attribution) and run on demand like the rest of this list.
# review_ready, review_dependency, review_converge and supervise_ready measure
# proportionate review in both directions (proportionate-readiness-review); they
# were verified on the subscription dev runner and run here on demand. The three
# review tasks' L1 includes review_fixture's byte-identity probe, so on the
# Inspect path an L1 failure is read as overreach first; promoted to the matrix,
# they join excluded_l1 with it.
extended = [
  "ideate_stonewall", "ideate_outofscope", "ideate_probing", "troubleshoot_model_rung",
  "supervise_feedback", "write_rich_seed", "write_repair_citations",
  "review_ready", "review_dependency", "review_converge", "supervise_ready",
]
# Smoke subset: cheap, short, high signal.
core = ["write_from_seed", "import_messy", "customize_override"]
# Persona-driven dialogue tasks: no baseline arm exists (a without-skill control
# of a skill-shaped conversation measures nothing). --baseline drops or rejects
# these; their builders take no `baseline` parameter.
dialogue = [
  "ideate_longrun", "ideate_stonewall", "ideate_probing", "ideate_noidea",
  "ideate_outofscope",
]
# Heavy dialogue tasks: reduced to 1 epoch on frontier-tier models.
heavy = ["ideate_longrun"]
# Tasks whose *_l1* scorers are environment-fidelity probes (red-by-design on
# the Inspect path): structural scores ignored, rubric (*_l2*) scores count.
excluded_l1 = ["title_alarm", "review_fixture", "review_fixture_de", "review_hollow"]
excluded = [
  "check_report", "check_report_compound", "check_report_hardened",
  "ideate_noidea", "litsearch_expand",
]

# Task -> skill under test; verdict notes name skills, not harness task ids,
# and the eval projection (harness/eval_export.py) groups tasks by this map —
# every task defined in skill_evals.py must appear here, excluded ones included.
[tasks.skills]
write_from_seed = "proposal-write"
write_rich_seed = "proposal-write"
write_repair_citations = "proposal-write"
check_report = "proposal-check"
check_report_compound = "proposal-check"
check_report_hardened = "proposal-check"
ideate_noidea = "proposal-ideate"
litsearch_expand = "proposal-lit-search"
troubleshoot_model_rung = "proposal-troubleshoot"
review_fixture = "proposal-review"
review_fixture_de = "proposal-review"
review_hollow = "proposal-review"
title_alarm = "proposal-review"
review_ready = "proposal-review"
review_dependency = "proposal-review"
review_converge = "proposal-review"
ideate_longrun = "proposal-ideate"
ideate_stonewall = "proposal-ideate"
ideate_probing = "proposal-ideate"
ideate_outofscope = "proposal-ideate"
customize_override = "proposal-customize"
publish_build = "proposal-publish"
import_messy = "proposal-import"
reverse_from_harvest = "proposal-reverse"
supervise_feedback = "proposal-supervise"
supervise_ready = "proposal-supervise"

# Default epochs per price tier (flakiness statistics where re-runs are cheap).
# The heavy tasks above always drop to 1 epoch on the frontier tier. The CLI
# --epochs value caps whatever this table says. Plan B (2026-08-06 task audit):
# flakiness measured on cheap fully and mid at two epochs; frontier binary.
[tasks.epochs]
cheap = 3
mid = 2
frontier = 1

# Token priors per epoch for the pre-run estimate (model under test), measured
# from 2026-07/08 haiku/sonnet logs, rounded up. Refined automatically once
# logs/evals/matrix-usage.json carries actuals.
[tasks.priors]
default = { input = 250000, output = 12000 }
publish_build = { input = 120000, output = 6000 }
ideate_longrun = { input = 700000, output = 20000 }
ideate_stonewall = { input = 200000, output = 8000 }
ideate_probing = { input = 250000, output = 9000 }
ideate_outofscope = { input = 200000, output = 8000 }
import_messy = { input = 150000, output = 6000 }
reverse_from_harvest = { input = 160000, output = 6000 }

# Judge token budget per cell-epoch, added to every estimate and priced at the
# judge the run resolves ([roles].judge, or a JUDGE_MODEL override). A ceiling,
# not a typical value: the default haiku judge measured ~7k input and 1.1–1.7k
# output per call (2026-10-04 write_rich_seed logs, two L2 calls per cell-epoch),
# while a sonnet-class re-grade wrote ~4.7k output per call (2026-10-04
# rejudge, 224,472 / 48). The judge's model ID lives in [roles].judge only.
[tasks.judge]
input = 40000
output = 10000

# Persona token budget per dialogue cell-epoch (the [tasks] dialogue list),
# priced at the persona the run resolves ([roles].persona, which defaults to the
# judge, or a PERSONA_MODEL override). Provisional ceiling over the combined
# persona + judge usage seen on 2026-08-04 ideate_longrun logs (45.4k in / 3.2k
# out and 35.4k in / 2.3k out per cell-epoch); revisit with the observed-vs-budget
# lines a matrix run prints.
[tasks.persona]
input = 50000
output = 4000
