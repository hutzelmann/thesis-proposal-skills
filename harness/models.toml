# Model-support matrix registry — the single source of every model ID the
# harness uses: the matrix roster below and the roles table.
#
# IDs are pinned OpenRouter model IDs (version visible in the ID); upgrades are
# deliberate edits — proposed weekly by harness/model_currency.py as a bump PR —
# never runtime "latest" resolution. Floating aliases (`sonnet`, `~…`, `…-latest`)
# fail parsing.
#
# Price basis: $/Mtok from the model vendor's own OpenRouter endpoint at its
# standard tier (not /flex, not /fast); `price_endpoint` names the endpoint tag
# where the vendor's provider slug differs from its namespace. Prices feed both
# the pre-run estimate and the post-run actual-cost report; prices_as_of is the
# date they were copied. cache_read_price and cache_write_price are optional and
# default to input_price; actual spend charges each token kind at its own price.
# `uv run poe models` compares everything here against the public catalog
# (networked, read-only).

prices_as_of = 2026-10-13
# New version lines in a roster vendor namespace created after this date are
# reported (never written) by the currency check. Moved by hand only.
lines_reviewed_as_of = 2026-08-06

# Every model ID used outside the roster. judge and persona are held: the
# currency check reports a newer model in their line but never rewrites them,
# because changing either invalidates every rubric-counted cell until a full
# re-baseline. A held ID that leaves the roster keeps its price in a
# [role_prices."<id>"] entry, which `model_currency.py --write` creates.
[roles]
judge = "openrouter/anthropic/claude-haiku-4.5"   # matrix L2 judge (held)
# persona defaults to judge
smoke = "openrouter/anthropic/claude-haiku-5.5"   # metered smoke model; an enabled roster entry
dev_judge = "claude-sonnet-5-5"                   # subscription CLI full ID, never an alias
dev_judge_effort = "medium"

[[models]]
id = "openrouter/anthropic/claude-haiku-5.5"
family = "anthropic"
tier = "cheap"
input_price = 0.1
output_price = 0.5
cache_read_price = 0.01
cache_write_price = 0.125
enabled = true
# Routing, not a matrix cell. Re-measured on this row's model when it replaced
# haiku 4.5 (2026-10-13, routing rig, claude.ai surfaces closed, CLI 2.1.296,
# served model logged per case in logs/routing/20261013-113156.json):
# write-polish-collision reached proposal-write 2/3; the two bug-report cases
# reached proposal-troubleshoot 3/6 (collision 1/3, oblique 2/3). Haiku 4.5 had
# measured 0/3 on polish with synced surfaces present and 0/33 on the bug-report
# requests (2026-10-05-route-polish-to-write and
# 2026-10-05-route-bug-reports-to-troubleshoot, measurement.md).
note = "with all skills installed, polishing and editing requests are not reliably routed to proposal-write (2/3 on the routing rig, 2026-10-13) — use sonnet or opus for such passes; questions about a misbehaving skill or a bug to report often go unanswered by proposal-troubleshoot (3/6 on the routing rig, 2026-10-13) — invoke it by name (/proposal-troubleshoot in Claude Code) or use sonnet or opus"

# The previous haiku row, kept when haiku 5.5 replaced it (2026-10-13): its
# measured verdict is the only shipped `fail`, proposal-troubleshoot warns users
# still on it (GitHub Copilot serves it), and the matrix judge and persona are
# held on it until a full re-baseline. Disabled, so no matrix run spends on it;
# untracked, so the weekly currency check never proposes replacing it again.
# Its note: with only proposal-write installed (dev runner) haiku 4.5 loads it
# for a polishing request 3/3, but with all skills installed (routing rig) the
# polish case reached no skill, 0/3 before and after the description edit
# (2026-10-05-route-polish-to-write/measurement.md); it loaded
# proposal-troubleshoot in 0 of 33 bug-report measurements
# (2026-10-05-route-bug-reports-to-troubleshoot/measurement.md).
[[models]]
