track = false
note = "with all skills installed, polishing and editing requests are not reliably routed to proposal-write (0/3 on the routing rig, 2026-10-05) — use sonnet or opus for such passes; questions about a misbehaving skill or a bug to report are answered without loading proposal-troubleshoot (0/33 on the routing rig, 2026-10-05) — invoke it by name (/proposal-troubleshoot in Claude Code) or use sonnet or opus"

