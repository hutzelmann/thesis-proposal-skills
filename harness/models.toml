# Model-support matrix registry — the single roster source for matrix runs.
# IDs are pinned OpenRouter model IDs (version visible in the ID); upgrades are
# deliberate one-line edits, never runtime "latest" resolution. Prices are
# $/Mtok cached from the OpenRouter catalog at pin time (2026-08-06) and feed
# both the pre-run estimate and the post-run actual-cost report.

