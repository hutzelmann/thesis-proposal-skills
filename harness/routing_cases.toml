# ---------- stage handoff ----------------------------------------------------
# The status moment (check owns it, trigger_terms.json) and the continuation
# phrases the handoffs suggest. A handoff names the step, never the skill, so the
# phrase it offers must reach the skill that owns the step from the
# descriptions alone (skill-packaging spec: stage handoff at stopping points).

