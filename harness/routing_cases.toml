# Routing dataset — which skill does a host agent select for a user utterance?
#
# Unlike every other harness dataset, these cases never reach a skill body. They
# are decided by the frontmatter `description` alone, which is the only text a
# host reads before choosing. `expected` therefore encodes the *intended* trigger
# boundary, not what the current descriptions happen to say: a case whose route
# is wrong today is the point, not a dataset bug.
#
# Kinds:
#   canonical  the phrasing the skill's description literally promises
#   oblique    how a student actually types it — no vocabulary borrowed from us
#   collision  deliberately parked in a zone another skill also claims; carries a
#              word that skill owns while the intent stays unambiguous
#   negative   proposal-adjacent work no proposal-* skill should claim
#
# `expected = "none"` means no proposal-* skill may be selected.
# Files named in utterances are staged into the measurement workspace; see
# harness/routing.py WORKSPACE_FIXTURES.

# ---------- proposal-check ---------------------------------------------------

[[cases]]
id = "check-canonical"
utterance = "Please check my proposal microservice-technical-debt.md."
expected = "proposal-check"
kind = "canonical"
lang = "en"

[[cases]]
id = "check-oblique"
utterance = "Did I get the citations and the section headings right in microservice-technical-debt.md?"
expected = "proposal-check"
kind = "oblique"
lang = "en"

[[cases]]
id = "check-collision"
utterance = "Before I ask for a full review, run the mechanical checks over microservice-technical-debt.md."
expected = "proposal-check"
kind = "collision"
lang = "en"

