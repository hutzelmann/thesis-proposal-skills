name: Install check

# The README's skills-CLI command and the repository installer (install.py)
# against the tracked tree (skill-packaging spec: Installation verified against
# the tracked tree). Separate workflow on purpose:
# the weekly schedule exists to catch skills-CLI regressions between pushes
# without re-running the heavy build jobs, and the CLI stays unpinned because
# users run latest — a red scheduled run with no commit here names the
# installer as the moving part.

on:
  # main is what installers fetch; develop runs it too, so a broken install is
  # caught before a release moves main.
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the tracked tree via the README command and install.py
        run: python3 scripts/install_check.py
      - name: Verbatim README command against GitHub (scheduled only)
        if: github.event_name == 'schedule'
        run: python3 scripts/install_check.py --verbatim
