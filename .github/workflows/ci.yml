name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  l0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact patch while checkout floats on its major tag: setup-uv
      # stopped publishing major and minor tags at v8 as a supply-chain measure,
      # so `@v9` resolves to nothing. Bump this one by hand.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Sync dev environment
        run: uv sync --dev
      # The gate is the poe task, not a restatement of its steps: a change to
      # what `poe test` runs reaches CI without editing this file.
      - name: L0 gate (pytest + ruff + drift)
        run: uv run poe test
      - name: Coverage floor
        run: uv run poe cov
      - name: Spec validation (pinned in the poe task)
        run: uv run poe specs

  # The skills run on the student's machine, and a good share of those are
  # Windows. `sync_shared.py` shipped a header built from a `Path` for months:
  # every Windows clone failed the drift gate, and nobody here could see it.
  # A source-level rule now catches that specific class (test_repo_conventions);
  # this job catches what a rule cannot — line endings, encoding defaults,
  # tmp_path semantics. It runs the fast subset: the document toolchain is not
  # installable cheaply on this runner, and the export tiers have jobs below.
  l0-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0    # exact patch, see the l0 job
        with:
          python-version: "3.12"
      - name: Sync dev environment
        run: uv sync --dev
      - name: L0 fast subset
        run: uv run poe test-fast

  # Export tiers are verified by building real documents. The l0 job has no
  # document toolchain, so those tests skip there; these two jobs supply it from
  # pre-built published images, installing nothing into them.
  #
  # Tags are pinned on purpose: a red run must mean this repository changed, not
  # that an image was rebuilt overnight. Bump deliberately and re-run the corpus.
  # pandoc/extra 3.9.0.2 carries pandoc, a full TeX Live, and Python; pandoc/typst
  # 3.10.0.0 carries pandoc and typst but no Python, hence the shell script. The
  # pandoc versions differ between them, which widens coverage rather than
  # narrowing it.
  #
  # The -ubuntu tags are deliberate: these images also ship Alpine variants, and
  # the runner mounts a glibc-built node into a job container to execute actions,
  # which cannot run under musl — actions/checkout fails there before any build.
  build-latex:
    runs-on: ubuntu-latest
    container: pandoc/extra:3.9.0.2-ubuntu
    steps:
      - uses: actions/checkout@v7
      - name: Install the test runner
        # Ubuntu 24.04 marks its Python environment externally managed; this
        # container is discarded after the job, so overriding is safe here.
        run: pip3 install --break-system-packages --quiet pytest
      - name: Build every fixture on the LaTeX and word-processor tiers
        run: python3 -m pytest tests/unit/test_export_matrix.py -q

  build-typst:
    runs-on: ubuntu-latest
    container: pandoc/typst:3.10.0.0-ubuntu
    steps:
      - uses: actions/checkout@v7
      - name: Build every fixture on the typst tier
        run: sh scripts/ci_typst_build.sh
