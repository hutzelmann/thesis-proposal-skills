name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  l0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dev environment
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: L0 tests (no model calls)
        run: uv run pytest tests/unit/ -q
      - name: Generated-copy drift check
        run: uv run python scripts/sync_shared.py --check
      - name: Spec validation
        run: npx -y @fission-ai/openspec@latest validate --all --strict
