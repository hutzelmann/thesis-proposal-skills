[project]
name = "thesis-proposal-skills"
version = "0.1.0"
description = "Development and testing environment for the thesis-proposal-skills agent skill set"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "inspect-ai>=0.3",
    "openai>=2.50.0",
    "poethepoet>=0.48.0",
    "pytest>=8",
    "pytest-cov>=7",
    "pytest-xdist>=3.8",
    "ruff>=0.16.0",
]

[tool.poe.tasks]
test = ["_pytest", "_lint", "_drift", "conform"]
_pytest = "pytest"
_lint = "ruff check ."
_drift = "python3 scripts/sync_shared.py --check"
# the standard's own reference validator (the maintainers' Python skills-ref from
# github.com/agentskills/agentskills), pinned by commit inside scripts/conform.py
# and run through uvx; the first run needs network to fill the uv cache (a git
# clone of agentskills plus wheels), afterwards it works offline
conform = "python3 scripts/conform.py"
# end-to-end install of the tracked tree via the README command (networked,
# CLI deliberately unpinned) — CI job + weekly schedule, not part of `test`
install-check = "python3 scripts/install_check.py"
# inner loop: parallel, without the pandoc/typst builds. `test` stays the
# complete gate — never narrow it to this set.
# loadgroup honours @pytest.mark.xdist_group, which keeps the tests that edit
# tracked files in place (test_sync.py) on a single worker instead of racing
test-fast = "pytest -n auto --dist loadgroup -m 'not slow'"
cov = "pytest --cov --cov-report=term-missing --cov-fail-under=78"
dev = "python harness/claude_runner.py"
# model currency vs OpenRouter's public catalog: networked, read-only, no key;
# not part of `test` (L0 replays tests/unit/data/model_catalog/ instead)
models = "python3 harness/model_currency.py"
# one live, read-only request per lit-search source through the shipped modules
# (OpenAlex only when the shipped key lookup finds a key; never this repo's
# .env), one classified line each. Exits 1 when the code needs to change: a
# verification page not passed, an unexpected answer, zero hits; `busy` (HTTP
# 429, any 5xx, network) exits 0. No model call. Local only: not part of
# `test` or CI, so an external block never makes the suite flaky
lit-live = "python3 harness/lit_live.py"
# skill selection, not skill behaviour: needs a host install and a subscription,
# so it stays out of `test` and out of CI. Its verdict logic is covered there.
routing = "python harness/routing.py"
# the harness's own Claude login, in a home outside ~/.claude (harness/host_login.py).
# host-login and host-logout are the operator's: interactive, refused without a
# terminal or inside an agent session, and never run by an agent (AGENTS.md).
# host-status makes no model call and prints no account details; anyone may run it.
host-login = "python harness/host_login.py login"
host-status = "python harness/host_login.py status"
host-logout = "python harness/host_login.py logout"
audit = "python scripts/audit_scan.py"
audit-status = "python scripts/audit_status.py"
identify = "python scripts/identify_release.py"
# the OpenSpec gate; CI calls this task. The CLI runs through npx (networked
# on first use) at OPENSPEC_VERSION in scripts/validate_specs.py, the one place
# the OpenSpec CLI version is pinned: validate --all --strict, with requirements
# over the length limit held to openspec/long-requirements.json (a ratchet)
specs = "python3 scripts/validate_specs.py"
# the OpenSpec pin vs npm's latest release, plus the local CLI and the
# generatedBy stamp of .claude/skills: networked, read-only, not part of `test`
# (L0 stubs every source); the weekly workflow runs it in write mode
openspec-currency = "python3 scripts/openspec_currency.py"
_sync_dev = "uv sync --dev"
_hooks = "git config core.hooksPath .githooks"
# generated copies merge to ours and are then regenerated from the source; an
# unregistered driver is inert, so a clone without `poe setup` just gets an
# ordinary conflict
_merge_driver = "git config merge.ours.driver true"
setup = ["_sync_dev", "_hooks", "_merge_driver"]

# the everyday smoke: the core scenarios on the subscription dev runner, $0 in
# money. Each step is isolated with a hard budget cap; no envfile, so no key
# file is loaded, and the runner strips billing variables from every model run
# (testing-harness spec: Subscription text roles). Steps are commands, not task
# references (default_item_type), and a failing step does not stop the others —
# except a billing signal: once a step's line in the summary log carries
# `billing` (overage, an API-key source, no rate-limit report), every later
# step starts no host and records itself as not run, untested. The sequence
# cannot branch on that, so the runner reads the log (`--summary-log`); a log a
# dead sequence left behind is cleared by `--summarize`, the closing step.
# The closing step names every scenario (--expect), so a step that exits before
# recording its line is listed as a runner failure rather than left out.
[tool.poe.tasks.smoke]
sequence = [
    "python harness/claude_runner.py write_from_seed --isolated --max-budget-usd 2 --judge --summary-log logs/devrun/smoke.jsonl",
    "python harness/claude_runner.py import_messy --isolated --max-budget-usd 2 --summary-log logs/devrun/smoke.jsonl",
    "python harness/claude_runner.py customize_override --isolated --max-budget-usd 2 --summary-log logs/devrun/smoke.jsonl",
    "python harness/claude_runner.py --summarize logs/devrun/smoke.jsonl --expect write_from_seed import_messy customize_override",
]
default_item_type = "cmd"
ignore_fail = "return_non_zero"

# the former metered smoke, behind the matrix cost gate; run it only when the
# Inspect wiring itself changed. Its model is the registry's [roles].smoke.
[tool.poe.tasks.smoke-inspect]
cmd = "python harness/matrix.py --smoke"
envfile = ".env"

[tool.poe.tasks.matrix]
cmd = "python harness/matrix.py"
envfile = ".env"

# metered prompt-caching check on the Anthropic rows, behind the same cost gate:
# its worst-case estimate prints first and waits for approval (--estimate-only
# makes no model call). Re-run it after an Inspect upgrade.
[tool.poe.tasks.cache-probe]
cmd = "python harness/cache_probe.py"
envfile = ".env"

[tool.poe.tasks.report]
cmd = "python harness/report.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: spawns pandoc or typst — excluded from the `test-fast` lane",
    "xdist_group: pin tests that share mutable state to one worker (pytest-xdist)",
]
# A dependency deprecation is a finding, not background noise. If one proves
# unfixable it gets its own `ignore` entry naming the dependency, never a
# blanket relaxation.
filterwarnings = ["error"]
# Import roots for the tests, so no test file manipulates sys.path itself.
# Order matters where a module name exists more than once: `check.py` ships in
# proposal-check (the sync source) and in the import/write copies, and
# `common.py`/`crossref.py` ship in proposal-lit-search (source) and in the
# import copy. The sync sources are listed first so `import check` and
# `import common` resolve to the file a developer edits.
pythonpath = [
    "tests",
    "harness",
    "scripts",
    "skills/proposal-check/scripts",
    "skills/proposal-lit-search/scripts",
    "skills/proposal-import/scripts",
    "skills/proposal-publish/scripts",
    "skills/proposal-troubleshoot/scripts",
    # the repository installer (install.py) — user-side, but outside skills/
    # so it never installs itself
    ".",
]

[tool.coverage.run]
source = ["harness", "scripts", "skills"]
source_pkgs = ["install"]
omit = [
    # skill_evals.py runs only under `inspect eval`, never at L0: the L0 suite
    # builds and stages every task and pins the judge prompt
    # (test_eval_wiring.py), but its scorer and solver bodies execute only
    # inside an eval against a model, so the floor leaves the file out.
    "harness/skill_evals.py",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["skills/proposal-import/scripts/common.py", "skills/proposal-import/scripts/crossref.py"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B",
    "C90",                      # mccabe complexity
    "PLR0912", "PLR0915",       # too many branches / statements
    "SIM", "RET", "C4", "PTH", "ARG", "PT", "RUF",
]
# The user-facing report prose deliberately uses em dashes, `×`, and typographic
# quotes; the ambiguous-unicode rules are correct in general and wrong here.
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.mccabe]
max-complexity = 12

# No per-file-ignores. Every exemption this repository once carried has been
# cleared by the change that owned it; if one has to come back, give it an
# owner in the same comment.
